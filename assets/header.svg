<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Terminale: whoami, Yuri Copparini, web developer, Ancona" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Effetto "bagliore" dei vecchi monitor CRT: il testo viene sfocato e sovrapposto a sé stesso -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Linee di scansione orizzontali: una riga scura ogni 3 pixel -->
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <!-- Vignettatura: bordi più scuri, centro più luminoso -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Maschere per l'effetto "digitazione": un rettangolo che si allarga scopre il comando -->
    <clipPath id="type1"><rect x="40" y="62" height="30" width="0">
      <animate attributeName="width" from="0" to="260" begin="0.3s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="type2"><rect x="40" y="134" height="30" width="0">
      <animate attributeName="width" from="0" to="300" begin="1.8s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="type3"><rect x="40" y="206" height="30" width="0">
      <animate attributeName="width" from="0" to="340" begin="3.4s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="win"><rect x="10" y="10" width="980" height="300" rx="14"/></clipPath>
  </defs>

  <style>
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cmd   { fill: #ffb000; font-size: 18px; }
    .out   { fill: #d99a2b; font-size: 18px; opacity: 0; }
    .dim   { fill: #7a5a24; }
    .red   { fill: #ff4d3d; }
    .label { fill: #b37a00; font-size: 12px; letter-spacing: 2px; }
  </style>

  <!-- Finestra del terminale -->
  <rect x="10" y="10" width="980" height="300" rx="14" fill="#120d06" stroke="#3a2a10" stroke-width="2"/>
  <path d="M10 24 a14 14 0 0 1 14 -14 h952 a14 14 0 0 1 14 14 v22 h-980 z" fill="#1c140a"/>
  <circle cx="36" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="58" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="28" r="6" fill="#27c93f"/>
  <text x="500" y="33" text-anchor="middle" class="mono dim" font-size="13">yuri@ancona: ~</text>

  <g filter="url(#glow)" class="mono">
    <!-- 1 · whoami -->
    <text x="40" y="84" class="cmd" clip-path="url(#type1)"><tspan class="dim">~ $ </tspan>whoami</text>
    <text x="40" y="114" class="out">Yuri Copparini — web developer · Ancona, IT
      <animate attributeName="opacity" to="1" begin="1.1s" dur="0.2s" fill="freeze"/></text>

    <!-- 2 · stack -->
    <text x="40" y="156" class="cmd" clip-path="url(#type2)"><tspan class="dim">~ $ </tspan>cat stack.txt</text>
    <text x="40" y="186" class="out">next.js · typescript · tailwind · postgres
      <animate attributeName="opacity" to="1" begin="2.7s" dur="0.2s" fill="freeze"/></text>

    <!-- 3 · progetto -->
    <text x="40" y="228" class="cmd" clip-path="url(#type3)"><tspan class="dim">~ $ </tspan>./mercuriale --info</text>
    <text x="40" y="258" class="out"><tspan class="red">●</tspan> open data: ogni prezzo con fonte e data
      <animate attributeName="opacity" to="1" begin="4.4s" dur="0.2s" fill="freeze"/></text>

    <!-- prompt finale con cursore lampeggiante -->
    <text x="40" y="292" class="cmd dim" opacity="0">~ $
      <animate attributeName="opacity" to="1" begin="4.9s" dur="0.1s" fill="freeze"/></text>
    <rect x="82" y="276" width="11" height="20" fill="#ffb000" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="4.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pannello a destra: "monitor" di Mercuriale con un grafico che si disegna -->
  <g class="mono">
    <rect x="640" y="70" width="320" height="200" rx="8" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
    <text x="660" y="98" class="label">MERCURIALE</text>
    <circle cx="940" cy="94" r="4" class="red">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="660" y1="110" x2="940" y2="110" stroke="#3a2a10"/>
    <!-- griglia -->
    <g stroke="#2a1f0c" stroke-width="1">
      <line x1="660" y1="150" x2="940" y2="150"/>
      <line x1="660" y1="190" x2="940" y2="190"/>
      <line x1="660" y1="230" x2="940" y2="230"/>
    </g>
    <!-- La linea parte "nascosta" (dashoffset = lunghezza) e si disegna portando l'offset a 0 -->
    <polyline filter="url(#glow)" fill="none" stroke="#ffb000" stroke-width="2.5" stroke-linejoin="round"
      points="660,200 690,188 720,194 750,170 780,176 810,150 840,162 870,138 900,146 940,124"
      stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" from="400" to="0" begin="0.5s" dur="2.5s" fill="freeze"/>
    </polyline>
    <text x="660" y="256" class="label" style="font-size:11px;letter-spacing:1px">materie prime · carburanti · UE/USA</text>
  </g>

  <!-- Sovrapposizioni CRT -->
  <rect x="10" y="46" width="980" height="264" fill="url(#scan)" clip-path="url(#win)" pointer-events="none"/>
  <rect x="10" y="10" width="980" height="300" rx="14" fill="url(#vignette)" pointer-events="none">
    <animate attributeName="opacity" values="1;0.9;1;0.95;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
